<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auditoría ISO/IEC 27001:2022</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08090a; --surface:#0f1011; --raised:#1a1b1e; --popover:#1c1d1f;
  --fg:#f7f8f8; --fg2:#d0d6e0; --muted:#8a8f98; --subtle:#62666d;
  --border:rgba(255,255,255,.06); --border-strong:rgba(255,255,255,.1); --border-solid:#23252a;
  --accent:#5e6ad2; --accent-hover:#6e79de; --accent-i:#7170ff;
  --ok:#27a644; --warn:#f2994a; --pend:#e2a336; --err:#eb5757;
  --r-sm:6px; --r-md:12px; --r-lg:16px;
  --ease:cubic-bezier(.22,1,.36,1);
  --font:'Inter Variable','Inter',system-ui,sans-serif;
  --mono:'Berkeley Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:400 14px/1.5 var(--font);font-feature-settings:"cv01","ss03";letter-spacing:-.011em;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:16px;padding:16px 24px;border-bottom:1px solid var(--border);background:var(--surface)}
header h1{font-size:14px;font-weight:600;margin:0;letter-spacing:-.01em}
header .meta{color:var(--muted);font-size:13px}
header .spacer{flex:1}
.btn{font:500 13px var(--font);color:var(--fg2);background:var(--raised);border:1px solid var(--border-strong);border-radius:var(--r-sm);padding:4px 12px;height:28px;cursor:pointer;transition:background 100ms var(--ease),border-color 100ms var(--ease),transform 100ms var(--ease)}
a.btn{display:inline-flex;align-items:center;text-decoration:none}
.btn:hover{background:#23252a;color:var(--fg)}
.btn:active{transform:scale(.97)}
.btn:focus-visible,.f:focus-visible{outline:2px solid var(--accent-i);outline-offset:1px}
.btn.primary{background:var(--accent);border-color:transparent;color:#fff}
.btn.primary:hover{background:var(--accent-hover)}
.btn:disabled{opacity:.5;cursor:default}
.btn.sm{height:24px;padding:0 8px;font-size:12px}
main{flex:1;overflow:auto}
table{border-collapse:separate;border-spacing:0;min-width:2400px;width:100%}
th{position:sticky;top:0;z-index:2;background:var(--surface);color:var(--muted);font-weight:500;font-size:12px;text-align:left;padding:8px 12px;border-bottom:1px solid var(--border-strong);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--border);vertical-align:top;background:var(--bg)}
tr:hover td{background:#0c0d0e}
th:first-child,td:first-child{position:sticky;left:0;z-index:1;border-right:1px solid var(--border)}
th:first-child{z-index:3}
td:first-child{background:var(--surface);width:112px;min-width:112px}
.cell-id{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.id-row{display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--subtle)}
.dirty .dot{background:var(--pend)}
.saved .dot{background:var(--ok)}
.error .dot{background:var(--err)}
.num{font:400 12px var(--mono);color:var(--muted)}
.f{width:100%;font:400 13px/1.5 var(--font);letter-spacing:-.01em;color:var(--fg2);background:transparent;border:1px solid transparent;border-radius:var(--r-sm);padding:4px 8px;resize:vertical;transition:background 100ms var(--ease),border-color 100ms var(--ease)}
.f:hover{background:var(--surface);border-color:var(--border)}
.f:focus{background:var(--raised);border-color:var(--border-strong);color:var(--fg);outline:none}
select.f{appearance:none;cursor:pointer;min-height:28px}
textarea.f{min-height:64px}
select.f option{background:var(--popover);color:var(--fg)}
select.f[data-v="Cumple"]{color:var(--ok)}
select.f[data-v="No cumple"]{color:var(--err)}
select.f[data-v="Alto"]{color:var(--err)}
select.f[data-v="Medio"]{color:var(--warn)}
select.f[data-v="Bajo"]{color:var(--pend)}
footer{display:flex;align-items:center;gap:16px;padding:12px 24px;border-top:1px solid var(--border);background:var(--surface)}
#status{color:var(--muted);font-size:13px}
#status.err{color:var(--err)}
.empty{padding:48px 24px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <h1>Auditoría ISO/IEC 27001:2022</h1>
  <span class="meta" id="count"></span>
  <span class="spacer"></span>
  <button class="btn" id="toggleView">Ver hoja</button>
  <a class="btn" id="openSheet" target="_blank" rel="noopener" href="https://docs.google.com/spreadsheets/d/1DvekY537Mb-x2fmDWqVABPTFsVvvPnQf-qh1jP21n2c/edit">Abrir en Sheets</a>
  <button class="btn" id="reload">Recargar desde Sheets</button>
  <button class="btn primary" id="addRow">Agregar fila</button>
</header>
<main><table id="grid"><thead></thead><tbody></tbody></table><div id="empty" class="empty" hidden>No hay filas. Usa Agregar fila para empezar.</div></main>
<iframe id="sheetView" hidden title="Hoja de Google Sheets" style="flex:1;border:0;background:#fff" src="about:blank"></iframe>
<footer><span id="status">Cargando datos…</span></footer>

<script>
/* ===== Configuración ===== */
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSbyj8gd3xOdlOUD0EpdUTKh-uJFScnc6-lN-SNQ53d0QbVKobwsSrSH2wVOluD_uBhp6nkpw0r0jR6/pub?output=csv";
// Pega aquí la URL de tu Apps Script desplegado (ver apps-script.gs)
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyHIH73Ci-6hke8ao8CWIxt4CdUhI31HxF0NNyvSizKYxHJLdLRIQCZhoWD8LluwLXxeQ/exec";

const COLS = [
  {k:"dominio", l:"Dominio / Proceso", t:"area", w:180},
  {k:"ref", l:"Referencia ISO/IEC 27001:2022", t:"area", w:170},
  {k:"control", l:"Control / Requisito", t:"area", w:200},
  {k:"objetivo", l:"Objetivo del control", t:"area", w:200},
  {k:"criterio", l:"Criterio de auditoría / Qué verificar", t:"area", w:240},
  {k:"evidencia", l:"Evidencia requerida", t:"area", w:220},
  {k:"prueba", l:"Prueba / Procedimiento de auditoría", t:"area", w:220},
  {k:"resultado", l:"Resultado", t:"sel", o:["Cumple","No cumple"], w:120},
  {k:"hallazgo", l:"Hallazgo / Observación", t:"area", w:240},
  {k:"riesgo", l:"Nivel de riesgo", t:"sel", o:["Alto","Medio","Bajo"], w:110},
  {k:"recomendacion", l:"Recomendación", t:"area", w:240},
  {k:"responsable", l:"Responsable", t:"area", w:160}
];
const N = COLS.length + 1; // incluye N.º

let rows = []; // {id, vals:[], state:'saved'|'dirty'|'error'}

/* ===== CSV ===== */
function parseCSV(text){
  const out=[]; let row=[], cell="", q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++} else q=false }
      else cell+=c;
    } else if(c==='"') q=true;
    else if(c===','){row.push(cell);cell=""}
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n')i++; row.push(cell);out.push(row);row=[];cell="" }
    else cell+=c;
  }
  if(cell!==""||row.length){row.push(cell);out.push(row)}
  return out.filter(r=>r.some(x=>x.trim()!==""));
}
function clean(v,col){
  v=(v||"").replace(/\s+/g," ").trim();
  if(v.toLowerCase()==="null") return "";
  if(col&&col.t==="sel"&&!col.o.includes(v)) return "";
  return v;
}

/* ===== Render ===== */
const $=s=>document.querySelector(s);
const thead=$("#grid thead"), tbody=$("#grid tbody");
thead.innerHTML="<tr><th>N.º</th>"+COLS.map(c=>`<th style="min-width:${c.w}px">${c.l}</th>`).join("")+"</tr>";

function setStatus(msg,err){const s=$("#status");s.textContent=msg;s.className=err?"err":""}
function updateCount(){
  $("#count").textContent=rows.length+" filas";
  const d=rows.filter(r=>r.state==="dirty").length;
  if(d) $("#count").textContent+=" · "+d+" sin subir";
  $("#empty").hidden=rows.length>0;
}

function render(){
  tbody.innerHTML="";
  rows.forEach(r=>tbody.appendChild(buildRow(r)));
  updateCount();
}

function buildRow(r){
  const tr=document.createElement("tr");
  tr.className=r.state;
  const id=document.createElement("td");
  id.innerHTML=`<div class="cell-id"><div class="id-row"><span class="dot"></span><span class="num">${r.id}</span></div></div>`;
  const btn=document.createElement("button");
  btn.className="btn sm primary"; btn.textContent="Subir";
  btn.onclick=()=>upload(r,tr,btn);
  id.firstChild.appendChild(btn);
  tr.appendChild(id);
  COLS.forEach((c,i)=>{
    const td=document.createElement("td");
    let el;
    if(c.t==="sel"){
      el=document.createElement("select");
      el.innerHTML='<option value="">—</option>'+c.o.map(o=>`<option>${o}</option>`).join("");
    } else { el=document.createElement("textarea"); el.rows=2 }
    el.className="f"; el.value=r.vals[i]||""; el.dataset.v=el.value;
    el.setAttribute("aria-label",c.l);
    el.addEventListener("input",()=>{
      r.vals[i]=el.value; el.dataset.v=el.value;
      r.state="dirty"; tr.className="dirty"; updateCount();
    });
    td.appendChild(el); tr.appendChild(td);
  });
  return tr;
}

/* ===== Cargar ===== */
async function load(){
  setStatus("Cargando datos…");
  try{
    const res=await fetch(CSV_URL+"&t="+Date.now());
    if(!res.ok) throw new Error("HTTP "+res.status);
    const data=parseCSV(await res.text());
    const body=data.slice(1);
    rows=body.map(cells=>({
      id:(cells[0]||"").trim(),
      vals:COLS.map((c,i)=>clean(cells[i+1],c)),
      state:"saved"
    })).filter(r=>r.id);
    render();
    setStatus(`${rows.length} filas cargadas desde Google Sheets.`);
  }catch(e){
    setStatus("No se pudo cargar la hoja: "+e.message+". Revisa que esté publicada como CSV.",true);
  }
}

/* ===== Subir ===== */
async function upload(r,tr,btn){
  if(!SCRIPT_URL){setStatus("Falta la URL del Apps Script en SCRIPT_URL. Mira apps-script.gs.",true);return}
  btn.disabled=true; btn.textContent="Subiendo…";
  try{
    await fetch(SCRIPT_URL,{
      method:"POST", mode:"no-cors",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify({row:[r.id,...r.vals]})
    });
    r.state="saved"; tr.className="saved"; updateCount();
    setStatus(`Fila ${r.id} subida a Google Sheets.`);
  }catch(e){
    r.state="error"; tr.className="error";
    setStatus(`No se pudo subir la fila ${r.id}: ${e.message}`,true);
  }finally{ btn.disabled=false; btn.textContent="Subir" }
}

/* ===== Agregar fila ===== */
$("#addRow").onclick=()=>{
  const max=rows.reduce((m,r)=>Math.max(m,parseInt(r.id)||0),0);
  const r={id:String(max+1),vals:COLS.map(()=>""),state:"dirty"};
  rows.push(r);
  const tr=buildRow(r); tbody.appendChild(tr); updateCount();
  tr.scrollIntoView({block:"center"});
  tr.querySelector("textarea").focus();
  setStatus(`Fila ${r.id} creada. Complétala y pulsa Subir.`);
};
$("#reload").onclick=()=>{
  if(rows.some(r=>r.state==="dirty")&&!confirm("Hay filas sin subir. Se perderán los cambios. ¿Recargar?"))return;
  load();
};
window.addEventListener("beforeunload",e=>{if(rows.some(r=>r.state==="dirty")){e.preventDefault();e.returnValue=""}});
const SHEET_EMBED="https://docs.google.com/spreadsheets/d/e/2PACX-1vSbyj8gd3xOdlOUD0EpdUTKh-uJFScnc6-lN-SNQ53d0QbVKobwsSrSH2wVOluD_uBhp6nkpw0r0jR6/pubhtml?widget=true&headers=false";
$("#toggleView").onclick=()=>{
  const f=$("#sheetView"), m=document.querySelector("main"), showing=!f.hidden;
  f.hidden=showing; m.hidden=!showing;
  $("#toggleView").textContent=showing?"Ver hoja":"Volver a editar";
  if(!showing) f.src=SHEET_EMBED+"&t="+Date.now();
};
load();
</script>
</body>
</html>
